<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booking Ops Dashboard</title>
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f7fc; color: #2f2f32; }
      header { padding: 24px 32px; background: #fff; border-bottom: 1px solid #efeff2; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
      main { padding: 24px 32px; display: grid; gap: 20px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 8px 24px rgba(92, 85, 107, .08); }
      .metric { font-size: 28px; font-weight: 700; color: #5c556b; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      td, th { text-align: left; padding: 8px; border-bottom: 1px solid #efeff2; }
      input, button { height: 36px; border-radius: 8px; border: 1px solid #d8d5e8; padding: 0 12px; }
      button { background: #5c556b; color: #fff; cursor: pointer; }
      .muted { color: #88858e; }
      #log-filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
      #log-filters label { display: grid; gap: 4px; }
      select { height: 38px; }
      .log-table { overflow: auto; }
      #log-results td { max-width: 420px; overflow-wrap: anywhere; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Booking Ops Dashboard</h1>
        <div class="muted">5-15 秒级轮询，数据接口需要管理员 JWT。</div>
      </div>
      <div>
        <input id="token" placeholder="Bearer token" />
        <button id="save">保存</button>
      </div>
    </header>
    <main>
      <section class="grid" id="metrics"></section>
      <section class="card">
        <h2>最近错误</h2>
        <table id="errors"></table>
      </section>
      <section class="card">
        <h2>最近前端错误</h2>
        <table id="clientErrors"></table>
      </section>
      <section class="card">
        <h2>最近管理员操作</h2>
        <table id="audit"></table>
      </section>
      <section class="card">
        <h2>日志查询</h2>
        <form id="log-filters">
          <label>来源<select name="source"><option value="all">全部</option><option value="business">业务</option><option value="audit">管理员审计</option><option value="http">请求</option><option value="client">小程序异常</option><option value="alert">告警记录</option></select></label>
          <label>请求编号<input name="requestId" maxlength="128" /></label>
          <label>开始日期<input name="from" type="date" /></label>
          <label>结束日期<input name="to" type="date" /></label>
          <button type="submit">查询</button>
        </form>
        <p id="log-status" role="status">选择条件后查询，日期按上海时间计算。</p>
        <div class="log-table"><table id="log-results"></table></div>
        <button id="log-next" type="button" disabled>下一页</button>
      </section>
    </main>
    <script>
      const tokenInput = document.querySelector("#token");
      tokenInput.value = localStorage.getItem("booking_dashboard_token") || "";
      document.querySelector("#save").onclick = () => {
        localStorage.setItem("booking_dashboard_token", tokenInput.value.trim());
        logVersion += 1;
        document.querySelector("#log-results").innerHTML = "";
        document.querySelector("#log-status").textContent = "凭据已更新，请重新查询。";
        document.querySelector("#log-next").disabled = true;
        refreshSummary();
      };
      function escapeHtml(value) {
        const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        return String(value ?? "").replace(/[&<>"']/g, (character) => entities[character]);
      }
      function card(label, value) {
        return `<div class="card"><div class="muted">${escapeHtml(label)}</div><div class="metric">${escapeHtml(value)}</div></div>`;
      }
      function rows(items, fields) {
        return `<tr>${fields.map((field) => `<th>${escapeHtml(field)}</th>`).join("")}</tr>` + (items || []).map((item) => `<tr>${fields.map((field) => `<td>${escapeHtml(item[field])}</td>`).join("")}</tr>`).join("");
      }
      async function loadLogs(cursor) {
        const version = ++logVersion;
        const token = localStorage.getItem("booking_dashboard_token");
        logNext.disabled = true;
        document.querySelector("#log-status").textContent = "查询中…";
        document.querySelector("#log-results").innerHTML = "";
        try {
          if (!token) throw new Error("请先填写管理员凭据");
          const query = new URLSearchParams(logQuery);
          if (cursor) query.set("cursor", cursor);
          const response = await fetch(`/api/admin/logs?${query}`, { headers: { authorization: `Bearer ${token}` } });
          const json = await response.json();
          if (version !== logVersion || token !== localStorage.getItem("booking_dashboard_token")) return;
          if (!json.success) throw new Error(json.message || "查询失败");
          const data = json.data;
          document.querySelector("#log-results").innerHTML = rows(data.logs.map(item => ({
            ...item, metadata: JSON.stringify(item.metadata, null, 2)
          })), ["created_at", "source", "request_id", "source_request_id", "action", "result", "route", "metadata"]);
          logCursor = data.nextCursor;
          logNext.disabled = !data.hasMore;
          document.querySelector("#log-status").textContent = data.logs.length
            ? `本页 ${data.logs.length} 条${data.hasMore ? '，可继续查看下一页' : '，已到最后一页'}` : "未找到匹配日志";
        } catch (error) {
          if (version === logVersion) document.querySelector("#log-status").textContent = error.message || "查询失败，请重试";
        }
      }
      let logVersion = 0;
      let logCursor = null;
      let logQuery = "";
      const logForm = document.querySelector("#log-filters");
      const logNext = document.querySelector("#log-next");
      logForm.onsubmit = event => {
        event.preventDefault();
        logQuery = new URLSearchParams(new FormData(logForm)).toString();
        loadLogs(null);
      };
      logNext.onclick = () => loadLogs(logCursor);
      async function load() {
        const token = localStorage.getItem("booking_dashboard_token");
        if (!token) return;
        const res = await fetch("/api/admin/dashboard/summary", { headers: { authorization: `Bearer ${token}` } });
        const json = await res.json();
        if (token !== localStorage.getItem("booking_dashboard_token")) return;
        if (!json.success) {
          document.querySelector("#metrics").innerHTML = card("状态", json.message || "未授权");
          return;
        }
        const d = json.data;
        document.querySelector("#metrics").innerHTML = [
          card("今日请求量", d.todayRequests),
          card("近期活跃用户", d.recentActiveUsers.length),
          card("今日预约", d.todayAppointments),
          card("今日取消", d.todayCancelled),
          card("今日签到", d.todayCheckedIn),
          card("今日 no_show", d.todayNoShow),
          card("最近5分钟请求", d.recent5mRequests),
          card("最近5分钟错误", d.recent5mErrors),
          card("API错误率", d.apiErrorRate),
          card("平均响应ms", d.avgResponseMs),
          card("P95响应ms", d.p95ResponseMs),
          card("数据库", d.database.status)
        ].join("");
        document.querySelector("#errors").innerHTML = rows(d.recentErrors, ["created_at", "request_id", "path", "status_code"]);
        document.querySelector("#clientErrors").innerHTML = rows(d.recentClientErrors, ["created_at", "page", "message"]);
        document.querySelector("#audit").innerHTML = rows(d.recentAdminOperations, ["created_at", "action", "resource_type", "resource_id"]);
      }
      function refreshSummary() {
        load().catch(() => { document.querySelector("#metrics").innerHTML = card("状态", "暂时无法读取，请稍后重试"); });
      }
      refreshSummary();
      setInterval(refreshSummary, 10000);
    </script>
  </body>
</html>

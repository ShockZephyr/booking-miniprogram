name: Local regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: booking_audit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 127.0.0.1:55483:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_audit"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUN_DB_TESTS: '0'
      PG_BIN: /usr/lib/postgresql/18/bin
      TEST_DATABASE_URL: postgres://postgres:ci_${{ github.run_id }}_${{ github.run_attempt }}@127.0.0.1:55483/booking_audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install matching PostgreSQL backup tools
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - run: npm --prefix backend ci
      - run: npm --prefix backend test
      - run: npm --prefix backend run test:db
        env:
          RUN_DB_TESTS: '1'
      - run: npm --prefix backend audit --omit=dev --audit-level=high

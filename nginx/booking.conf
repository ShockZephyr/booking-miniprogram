limit_req_zone $binary_remote_addr zone=booking_api:10m rate=10r/s;

server {
  listen 80;
  server_name example.invalid;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name example.invalid;

  ssl_certificate /etc/letsencrypt/live/example.invalid/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;

  client_max_body_size 1m;

  location = /api/admin/therapist-images {
    client_max_body_size 8m;
    limit_req zone=booking_api burst=5 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:3000;
  }

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ~* ^/metrics/?$ {
    allow 127.0.0.1;
    deny all;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_pass http://127.0.0.1:3000;
  }

  location / {
    limit_req zone=booking_api burst=20 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:3000;
  }
}
